<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- "Add to Home Screen" opens it like an app: no browser bars (the only way on iPhone) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#200d2a">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body class="booting">
  <div id="bg"><canvas id="wave"></canvas></div>
  <div id="black"></div>
  <div id="xmb" aria-hidden="true"></div>
  <div id="clock" aria-hidden="true"></div>
  <div id="logo" aria-hidden="true"><b></b><small></small></div>
  <div id="notice"><b></b><p></p></div>
  <aside id="panel" aria-live="polite">
    <button id="close" aria-label="Close">✕</button>
    <div id="panel-body"></div>
  </aside>
  <!-- Plain copy of the content for screen readers and search engines, filled by main.js -->
  <main id="plain" class="sr-only"></main>
</body>
</html>
